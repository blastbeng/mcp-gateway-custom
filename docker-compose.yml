services:

  mcp-image-checker:
    image: docker:cli
    container_name: mcp-image-checker
    mem_limit: 128m
    restart: no
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./onionclaw:/opt/onionclaw:ro
      - ./model-council:/opt/model-council:ro
      - ./telegram-notify:/opt/telegram-notify:ro
      - ./local-image-reader:/opt/local-image-reader:ro
      - ./playwright:/opt/playwright:ro
      - ./torproxy:/opt/torproxy:ro
      - ./klaket:/opt/klaket:ro
      - ./socialpost:/opt/socialpost:ro
    environment:
      CHECK_INTERVAL: "3600"
    command:
      - sh
      - -c
      - |
        while true; do
          echo "=== MCP image check: $$(date) ==="

          for image in \
            isokoliuk/mcp-searxng:latest \
            ghcr.io/aas-ee/open-web-search:latest \
            mcp/tavily:latest \
            mcp/fetch:latest \
            mcp/chroma:latest \
            mcp/playwright:latest \
            node:22-alpine \
            golang:1.23-alpine \
            python:3.12-slim \
            alpine:3.20 \
            ghcr.io/oraios/serena:latest
          do
            if docker image inspect "$$image" >/dev/null 2>&1; then
              echo "OK: $$image"
            else
              echo "MISSING: $$image"
              echo "Pulling $$image..."
              docker pull "$$image" || echo "ERROR pulling $$image"
            fi
          done

          echo "--- OnionClaw MCP ---"

          if docker image inspect onionclaw-mcp:latest >/dev/null 2>&1; then
            echo "OK: onionclaw-mcp:latest"
          else
            echo "MISSING: onionclaw-mcp:latest"
            echo "Building onionclaw-mcp:latest..."

            docker build \
              --pull \
              -t onionclaw-mcp:latest \
              /opt/onionclaw \
              || echo "ERROR building onionclaw-mcp:latest"
          fi

          echo "--- Model Council MCP ---"

          if docker image inspect model-council-mcp:latest >/dev/null 2>&1; then
            echo "OK: model-council-mcp:latest"
          else
            echo "MISSING: model-council-mcp:latest"
            echo "Building model-council-mcp:latest..."

            docker build \
              --pull \
              -t model-council-mcp:latest \
              /opt/model-council \
              || echo "ERROR building model-council-mcp:latest"
          fi

          echo "--- Telegram Notify MCP ---"

          if docker image inspect telegram-notify-mcp:latest >/dev/null 2>&1; then
            echo "OK: telegram-notify-mcp:latest"
          else
            echo "MISSING: telegram-notify-mcp:latest"
            echo "Building telegram-notify-mcp:latest..."

            docker build \
              --pull \
              -t telegram-notify-mcp:latest \
              /opt/telegram-notify \
              || echo "ERROR building telegram-notify-mcp:latest"
          fi

          echo "--- Playwright MCP (stale-lock wrapper on mcp/playwright) ---"

          if docker image inspect playwright-mcp:latest >/dev/null 2>&1; then
            echo "OK: playwright-mcp:latest"
          else
            echo "MISSING: playwright-mcp:latest"
            echo "Building playwright-mcp:latest..."

            docker build \
              --pull \
              -t playwright-mcp:latest \
              /opt/playwright \
              || echo "ERROR building playwright-mcp:latest"
          fi

          echo "--- Local Image Reader MCP ---"

          if docker image inspect local-image-reader-mcp:latest >/dev/null 2>&1; then
            echo "OK: local-image-reader-mcp:latest"
          else
            echo "MISSING: local-image-reader-mcp:latest"
            echo "Building local-image-reader-mcp:latest..."

            docker build \
              --pull \
              -t local-image-reader-mcp:latest \
              /opt/local-image-reader \
              || echo "ERROR building local-image-reader-mcp:latest"
          fi

          echo "--- Klaket (offline audio/video) ---"

          for img in klaket-api klaket-worker klaket-mcp; do
            if docker image inspect "$$img:latest" >/dev/null 2>&1; then
              echo "OK: $$img:latest"
            else
              echo "MISSING: $$img:latest"
              echo "Building $$img:latest..."

              docker build \
                --pull \
                -t "$$img:latest" \
                -f "/opt/klaket/$${img#klaket-}.Dockerfile" \
                /opt/klaket \
                || echo "ERROR building $$img:latest"
            fi
          done

          echo "--- Social Post MCP (YouTube/IG/FB/TikTok) ---"

          if docker image inspect socialpost-mcp:latest >/dev/null 2>&1; then
            echo "OK: socialpost-mcp:latest"
          else
            echo "MISSING: socialpost-mcp:latest"
            echo "Building socialpost-mcp:latest..."

            docker build \
              --pull \
              -t socialpost-mcp:latest \
              /opt/socialpost \
              || echo "ERROR building socialpost-mcp:latest"
          fi

          echo "--- torproxy (local build, Tor >= 0.4.8) ---"

          if docker image inspect torproxy:latest >/dev/null 2>&1; then
            echo "OK: torproxy:latest"
          else
            echo "MISSING: torproxy:latest"
            echo "Building torproxy:latest..."

            docker build \
              --pull \
              -t torproxy:latest \
              /opt/torproxy \
              || echo "ERROR building torproxy:latest"
          fi

          echo "Next check in $${CHECK_INTERVAL}s"
          sleep "$${CHECK_INTERVAL}"
        done

  # Locally built (see torproxy/Dockerfile) because dperson/torproxy:latest is
  # frozen at Tor 0.4.4.8 (2021): the Tor network now requires the Desc=3 /
  # Microdesc=3 descriptor protocols (Tor >= 0.4.8), so that image failed
  # bootstrapping and exited with status 1 after ~120s. Under
  # `up --abort-on-container-exit` each exit restarted the whole stack
  # (~2.5 min cycles, 166 restarts) and leaked a new set of gateway stdio
  # children (chroma-mcp, ...) every time.
  torproxy:
    image: torproxy:latest
    build: ./torproxy
    container_name: torproxy
    mem_limit: 256m
    restart: no

    environment:
      TOR_LOG_LEVEL: err

    ports:
      - "0.0.0.0:9050:9050"
      - "0.0.0.0:8118:8118"

    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -fsS
          --socks5-hostname 127.0.0.1:9050
          https://check.torproject.org/api/ip
          >/dev/null
          || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      # A cold Tor client needs ~2 min on this Pi to reach 100%, so do not
      # flag the container unhealthy before then.
      start_period: 180s

    networks:
      - mcp

  # Klaket — offline audio/video analysis (transcript, speaker labels, scenes,
  # on-screen text, SRT/VTT). Upstream ships four parts: a Go API, a Redis
  # queue, a Python worker and a stdio MCP server. Here there are three
  # containers — the MCP server is not a compose service: the gateway spawns
  # `klaket-mcp:latest` from the catalog and reaches the API on the ai-mcp
  # network by service name. Dashboard and Argos translation are left out.
  #
  # Redis is NOT part of this project: Klaket uses the host-wide instance
  # already running from /opt/docker/compose/redis on 6379 (published on
  # 0.0.0.0), reached through host.docker.internal. That instance is shared,
  # so Klaket gets **db 3** (db0/db1/db2 are already in use by other
  # services). Upstream hardcodes database 0; both Dockerfiles patch
  # REDIS_DB in, and fail the build if the patch stops applying. The instance
  # has no password: if one is ever added, REDIS_ADDR alone cannot carry it
  # and this needs another (small) patch.
  klaket-api:
    image: klaket-api:latest
    container_name: klaket-api
    mem_limit: 128m
    restart: unless-stopped

    environment:
      # Shared Redis, separate DB — see the note above.
      REDIS_ADDR: host.docker.internal:6379
      REDIS_DB: "3"
      DATA_DIR: /data
      KLAKET_AUTH: "off"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Jobs metadata lives in Redis; artifacts (result.json, subtitles,
      # keyframes) are written by the worker into the same bind mount.
      - /opt/docker/compose/mcp/klaket-data:/data:rw
      # Local media is read by the WORKER, but the API hands the path through
      # unchanged: mounting the same roots read-only keeps path validation and
      # any future preview honest. Same paths as local-image-reader.
      - /tmp:/tmp:ro
      - /opt/projects:/opt/projects:ro
      - /opt/docker/compose:/opt/docker/compose:ro

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8484/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - mcp

  klaket-worker:
    image: klaket-worker:latest
    container_name: klaket-worker
    # 3 GB is the ceiling, not the reservation: `small` int8 + sherpa-onnx
    # diarization + OCR peaks around 1.5-2 GB. Combined with the other
    # services on this 8 GB host the kernel will swap during a job — that is
    # expected, and the reason KLAKET_MAX_DURATION exists.
    mem_limit: 3g
    restart: unless-stopped

    environment:
      REDIS_ADDR: host.docker.internal:6379
      REDIS_DB: "3"
      DATA_DIR: /data

      # `small` (~600-800 MB RSS) is the agreed default: noticeably better
      # Italian than base, at roughly 0.3-0.5x realtime on the Pi's CPU.
      # Override with KLAKET_WHISPER_MODEL in .env without editing this file.
      WHISPER_MODEL: ${KLAKET_WHISPER_MODEL:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE: int8

      KLAKET_OCR: "on"
      KLAKET_DIARIZE: "on"
      KLAKET_DIARIZE_THRESHOLD: "0.8"
      # 0 = unlimited. 7200 s rejects anything longer instead of letting a
      # 3-hour job hold the worker (and the swap) for a whole day.
      KLAKET_MAX_DURATION: "7200"
      # Scene descriptions need an LLM (ollama/openai): off, fully offline.
      KLAKET_VLM: "off"

      # All model caches on the bind mount, never in the writable layer.
      KLAKET_MODEL_DIR: /models
      HF_HOME: /models
      XDG_DATA_HOME: /models

      # ffmpeg/yt-dlp scratch must be writable; /tmp is read-only below
      # because it is the shared input scratch with the other MCP servers.
      TMPDIR: /data/tmp

      # Leave a core for the rest of the stack (gateway, litellm, ...).
      OMP_NUM_THREADS: "2"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - /opt/docker/compose/mcp/klaket-data:/data:rw
      - /opt/docker/compose/mcp/klaket-models:/models:rw
      # Media the agent already knows the path of, read-only at the same path.
      # Prefer /opt/projects over /tmp for real footage: /tmp is a 4 GB tmpfs,
      # i.e. RAM.
      - /tmp:/tmp:ro
      - /opt/projects:/opt/projects:ro
      - /opt/docker/compose:/opt/docker/compose:ro

    networks:
      - mcp

  mcp-gateway:
    image: docker/mcp-gateway:latest
    container_name: mcp-gateway
    mem_limit: 512m
    restart: "no"

    # The gateway owns the long-lived stdio children it spawns
    # (`docker run --rm ...`): it releases them on a graceful shutdown, so
    # give it room to do that instead of letting the 10s docker default
    # SIGKILL it mid-teardown — that was the source of the orphaned
    # chroma/telegram-notify containers.
    stop_grace_period: 90s

    command:
      - --transport=streaming
      - --port=8811
      - --catalog=/root/.docker/mcp/catalogs/custom.yaml
      - --servers=searxng
      - --servers=open-websearch
      - --servers=tavily
      - --servers=telegram-notify
      - --servers=fetch
      - --servers=chroma
      - --servers=onionclaw      
      - --servers=context7
      - --servers=model-council
      - --servers=playwright
      - --servers=local-image-reader
      - --servers=klaket
      - --servers=socialpost
      - --verify-signatures=false
      - --secrets=/root/.docker/mcp/.env

    ports:
      - "127.0.0.1:8813:8811"

    extra_hosts:
      - "host.docker.internal:host-gateway"


    environment:
      MCP_GATEWAY_AUTH_TOKEN: ${MCP_GATEWAY_AUTH_TOKEN}
      # socialpost-data holds app credentials and rotating OAuth tokens
      # (accounts.json, chmod 600): the server writes them at runtime, so it
      # needs both the read-only allowlist and the writable one.
      MCP_GATEWAY_DOCKER_BIND_ALLOWED_PATHS: "/opt/docker/compose/mcp/model-council-data:/opt/docker/compose/mcp/socialpost-data:/opt/projects:/opt/docker/compose:/tmp"
      # playwright's browser profile lives on /opt (never in the container layer,
      # i.e. never in /var/lib/docker on the small root fs); rw needs this list.
      # /tmp is here for playwright's output dir (screenshots/downloads land in
      # the shared host /tmp, rw); /tmp is already in the RO allowlist above.
      MCP_GATEWAY_DOCKER_BIND_ALLOW_WRITABLE_PATHS: "/opt/docker/compose/mcp/chroma-data:/opt/docker/compose/mcp/chroma-cache:/opt/docker/compose/mcp/onionclaw-data:/opt/docker/compose/mcp/socialpost-data:/opt/blast/cache/ms-playwright-mcp:/opt/blast/cache/ms-playwright:/tmp"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./catalog:/root/.docker/mcp/catalogs:ro
      - ./.env:/root/.docker/mcp/.env:ro

    security_opt:
      - no-new-privileges:true

    # Stop ordering: the gateway must go down *before* the backends its
    # children talk to (chroma, searxng, torproxy), so it can release the
    # children while those are still reachable. Compose stops in reverse
    # dependency order, hence the gateway depends_on them.
    depends_on:
      - chroma
      - searxng
      - torproxy

    networks:
      - mcp


  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    mem_limit: 512m
    restart: "no"

    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml

    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      - valkey

    networks:
      - mcp


  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: searxng-valkey
    mem_limit: 256m
    restart: "no"

    command:
      - valkey-server
      - --save
      - "300"
      - "1"
      - --loglevel
      - warning

    volumes:
      - valkey-data:/data

    security_opt:
      - no-new-privileges:true

    networks:
      - mcp

  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    mem_limit: 1g
    restart: no

    volumes:
      - ./chroma-data:/data

    ports:
      - "8000:8000"

    networks:
      - mcp

  # Keeps the council roster in step with LiteLLM (rules engine, see
  # model-council-data/sync-rules.json): adds a seat when a qualifying model
  # appears AND its probe answers, drops one after REMOVE_AFTER_MISSES failed
  # cycles (missing, gone, or probe-fail), removes paid seats the same cycle,
  # puts repeatedly-rejected candidates on a CANDIDATE_RETRY_HOURS cooldown;
  # no member is static — anything no rule claims is dropped. Rewrites
  # config.json only on a real change; the council server reads its roster
  # live (see model-council/entrypoint.py), so RESTART_GATEWAY is off and
  # the gateway is never bounced. Restarting it tore the whole stack down
  # (--abort-on-container-exit) and made the gateway respawn — and leak —
  # its long-lived stdio children.
  model-council-sync:
    image: python:3.12-alpine
    container_name: model-council-sync
    mem_limit: 64m
    restart: unless-stopped
    command:
      - python3
      - -u
      - /srv/sync.py
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./model-council-data:/config:rw
      - ./model-council-sync:/srv:ro
    environment:
      SYNC_INTERVAL: "3600"
      REMOVE_AFTER_MISSES: "2"
      CANDIDATE_STRIKES: "2"
      CANDIDATE_RETRY_HOURS: "24"
      PROBE_ENABLED: "true"
      PROBE_WORKERS: "12"
      RESTART_GATEWAY: "false"
      GATEWAY_CONTAINER: "mcp-gateway"
    security_opt:
      - no-new-privileges:true
    networks:
      - mcp

  # Session-healing reverse proxy in front of the docker-mcp gateway.
  # The gateway evicts idle in-memory MCP sessions (and loses them on
  # restart); streamable-HTTP clients that cache Mcp-Session-Id then hit a
  # permanent 404 "session not found". This proxy owns one upstream session,
  # hands the client a STABLE id, and re-initializes transparently on 404.
  mcp-session-proxy:
    image: python:3.12-alpine
    container_name: mcp-session-proxy
    mem_limit: 256m
    restart: unless-stopped
    command:
      - python3
      - -u
      - /srv/proxy.py
    volumes:
      - ./session-proxy/proxy.py:/srv/proxy.py:ro
      - ./.env:/opt/docker/compose/mcp/.env:ro
    environment:
      MCP_PROXY_UPSTREAM: http://mcp-gateway:8811/mcp
      MCP_PROXY_UPSTREAM_TIMEOUT: "900"
      MCP_PROXY_HOST: "0.0.0.0"
      MCP_PROXY_PORT: "8812"
    ports:
      - "8811:8812"
      - "8812:8812"
    depends_on:
      - mcp-gateway
    networks:
      - mcp
volumes:

  searxng-cache:
    name: searxng-cache

  valkey-data:
    name: searxng-valkey



networks:

  mcp:
    name: ai-mcp
    driver: bridge
