services:

  mcp-image-checker:
    image: docker:cli
    container_name: mcp-image-checker
    mem_limit: 128m
    restart: no
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./onionclaw:/opt/onionclaw:ro
      - ./model-council:/opt/model-council:ro
      - ./telegram-notify:/opt/telegram-notify:ro
      - ./local-image-reader:/opt/local-image-reader:ro
      - ./websearch:/opt/websearch:ro
      - ./playwright:/opt/playwright:ro
      - ./chrome-devtools:/opt/chrome-devtools:ro
      - ./torproxy:/opt/torproxy:ro
      - ./klaket:/opt/klaket:ro
    environment:
      CHECK_INTERVAL: "86400"
    command:
      - sh
      - -c
      - |
        while true; do
          echo "=== MCP image check: $$(date) ==="

          for image in \
            isokoliuk/mcp-searxng:latest \
            mcp/fetch:latest \
            mcp/chroma:latest \
            mcp/playwright:latest \
            node:22-alpine \
            golang:1.23-alpine \
            python:3.12-slim \
            alpine:3.20 \
            ghcr.io/oraios/serena:latest \
            node:22-bookworm-slim
          do
            if docker image inspect "$$image" >/dev/null 2>&1; then
              echo "OK: $$image"
            else
              echo "MISSING: $$image"
              echo "Pulling $$image..."
              docker pull "$$image" || echo "ERROR pulling $$image"
            fi
          done

          echo "--- OnionClaw MCP ---"

          if docker image inspect onionclaw-mcp:latest >/dev/null 2>&1; then
            echo "OK: onionclaw-mcp:latest"
          else
            echo "MISSING: onionclaw-mcp:latest"
            echo "Building onionclaw-mcp:latest..."

            docker build \
              --pull \
              -t onionclaw-mcp:latest \
              /opt/onionclaw \
              || echo "ERROR building onionclaw-mcp:latest"
          fi

          echo "--- Model Council MCP ---"

          if docker image inspect model-council-mcp:latest >/dev/null 2>&1; then
            echo "OK: model-council-mcp:latest"
          else
            echo "MISSING: model-council-mcp:latest"
            echo "Building model-council-mcp:latest..."

            docker build \
              --pull \
              -t model-council-mcp:latest \
              /opt/model-council \
              || echo "ERROR building model-council-mcp:latest"
          fi

          echo "--- Telegram Notify MCP ---"

          if docker image inspect telegram-notify-mcp:latest >/dev/null 2>&1; then
            echo "OK: telegram-notify-mcp:latest"
          else
            echo "MISSING: telegram-notify-mcp:latest"
            echo "Building telegram-notify-mcp:latest..."

            docker build \
              --pull \
              -t telegram-notify-mcp:latest \
              /opt/telegram-notify \
              || echo "ERROR building telegram-notify-mcp:latest"
          fi

          echo "--- Playwright MCP (stale-lock wrapper on mcp/playwright) ---"

          if docker image inspect playwright-mcp:latest >/dev/null 2>&1; then
            echo "OK: playwright-mcp:latest"
          else
            echo "MISSING: playwright-mcp:latest"
            echo "Building playwright-mcp:latest..."

            docker build \
              --pull \
              -t playwright-mcp:latest \
              /opt/playwright \
              || echo "ERROR building playwright-mcp:latest"
          fi

          echo "--- Chrome DevTools MCP ---"

          if docker image inspect chrome-devtools-mcp:latest >/dev/null 2>&1; then
            echo "OK: chrome-devtools-mcp:latest"
          else
            echo "MISSING: chrome-devtools-mcp:latest"
            echo "Building chrome-devtools-mcp:latest..."

            docker build \
              --pull \
              -t chrome-devtools-mcp:latest \
              /opt/chrome-devtools \
              || echo "ERROR building chrome-devtools-mcp:latest"
          fi

          echo "--- Local Image Reader MCP ---"

          if docker image inspect local-image-reader-mcp:latest >/dev/null 2>&1; then
            echo "OK: local-image-reader-mcp:latest"
          else
            echo "MISSING: local-image-reader-mcp:latest"
            echo "Building local-image-reader-mcp:latest..."

            docker build \
              --pull \
              -t local-image-reader-mcp:latest \
              /opt/local-image-reader \
              || echo "ERROR building local-image-reader-mcp:latest"
          fi

          echo "--- Web Search MCP (headless Chromium + keyless lanes) ---"

          if docker image inspect websearch-mcp:latest >/dev/null 2>&1; then
            echo "OK: websearch-mcp:latest"
          else
            echo "MISSING: websearch-mcp:latest"
            echo "Building websearch-mcp:latest..."

            docker build \
              --pull \
              -t websearch-mcp:latest \
              /opt/websearch \
              || echo "ERROR building websearch-mcp:latest"
          fi

          echo "--- Klaket (offline audio/video) ---"

          for img in klaket-api klaket-worker klaket-mcp; do
            if docker image inspect "$$img:latest" >/dev/null 2>&1; then
              echo "OK: $$img:latest"
            else
              echo "MISSING: $$img:latest"
              echo "Building $$img:latest..."

              docker build \
                --pull \
                -t "$$img:latest" \
                -f "/opt/klaket/$${img#klaket-}.Dockerfile" \
                /opt/klaket \
                || echo "ERROR building $$img:latest"
            fi
          done

          echo "--- torproxy (local build, Tor >= 0.4.8) ---"

          if docker image inspect torproxy:latest >/dev/null 2>&1; then
            echo "OK: torproxy:latest"
          else
            echo "MISSING: torproxy:latest"
            echo "Building torproxy:latest..."

            docker build \
              --pull \
              -t torproxy:latest \
              /opt/torproxy \
              || echo "ERROR building torproxy:latest"
          fi

          echo "Next check in $${CHECK_INTERVAL}s"
          sleep "$${CHECK_INTERVAL}"
        done

  # Locally built (see torproxy/Dockerfile) because dperson/torproxy:latest is
  # frozen at Tor 0.4.4.8 (2021): the Tor network now requires the Desc=3 /
  # Microdesc=3 descriptor protocols (Tor >= 0.4.8), so that image failed
  # bootstrapping and exited with status 1 after ~120s. Under
  # `up --abort-on-container-exit` each exit restarted the whole stack
  # (~2.5 min cycles, 166 restarts) and leaked a new set of gateway stdio
  # children (chroma-mcp, ...) every time.
  torproxy:
    image: torproxy:latest
    build: ./torproxy
    container_name: torproxy
    mem_limit: 256m
    restart: no

    environment:
      TOR_LOG_LEVEL: err

    ports:
      - "0.0.0.0:9050:9050"
      - "0.0.0.0:8118:8118"

    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -fsS
          --socks5-hostname 127.0.0.1:9050
          https://check.torproject.org/api/ip
          >/dev/null
          || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      # A cold Tor client needs ~2 min on this Pi to reach 100%, so do not
      # flag the container unhealthy before then.
      start_period: 180s

    networks:
      - mcp

  # Klaket — offline audio/video analysis (transcript, speaker labels, scenes,
  # on-screen text, SRT/VTT). Upstream ships four parts: a Go API, a Redis
  # queue, a Python worker and a stdio MCP server. Here there are three
  # containers — the MCP server is not a compose service: the gateway spawns
  # `klaket-mcp:latest` from the catalog and reaches the API on the ai-mcp
  # network by service name. Dashboard and Argos translation are left out.
  #
  # Redis is NOT part of this project: Klaket uses the host-wide instance
  # already running dalla stack redis su 192.168.1.160 (porta 6379 pubblicata
  # sulla LAN). Quella istanza e' condivisa,
  # so Klaket gets **db 3** (db0/db1/db2 are already in use by other
  # services). Upstream hardcodes database 0; both Dockerfiles patch
  # REDIS_DB in, and fail the build if the patch stops applying. The instance
  # has no password: if one is ever added, REDIS_ADDR alone cannot carry it
  # and this needs another (small) patch.
  klaket-api:
    image: klaket-api:latest
    container_name: klaket-api
    mem_limit: 128m
    restart: unless-stopped

    environment:
      # Shared Redis, separate DB — see the note above.
      REDIS_ADDR: 192.168.1.160:6379
      REDIS_DB: "3"
      DATA_DIR: /data
      KLAKET_AUTH: "off"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Jobs metadata lives in Redis; artifacts (result.json, subtitles,
      # keyframes) are written by the worker into the same bind mount.
      - /opt/docker/compose/mcp/klaket-data:/data:rw
      # Local media is read by the WORKER, but the API hands the path through
      # unchanged: mounting the same roots read-only keeps path validation and
      # any future preview honest. Same paths as local-image-reader.
      - /tmp:/tmp:ro
      - /opt/projects:/opt/projects:ro
      - /opt/docker/compose:/opt/docker/compose:ro

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8484/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - mcp

  klaket-worker:
    image: klaket-worker:latest
    container_name: klaket-worker
    # 3 GB is the ceiling, not the reservation: `small` int8 + sherpa-onnx
    # diarization + OCR peaks around 1.5-2 GB. Combined with the other
    # services on this 8 GB host the kernel will swap during a job — that is
    # expected, and the reason KLAKET_MAX_DURATION exists.
    mem_limit: 3g
    restart: unless-stopped

    environment:
      REDIS_ADDR: 192.168.1.160:6379
      REDIS_DB: "3"
      DATA_DIR: /data

      # `small` (~600-800 MB RSS) is the agreed default: noticeably better
      # Italian than base, at roughly 0.3-0.5x realtime on the Pi's CPU.
      # Override with KLAKET_WHISPER_MODEL in .env without editing this file.
      WHISPER_MODEL: ${KLAKET_WHISPER_MODEL:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE: int8

      KLAKET_OCR: "on"
      KLAKET_DIARIZE: "on"
      KLAKET_DIARIZE_THRESHOLD: "0.8"
      # 0 = unlimited. 7200 s rejects anything longer instead of letting a
      # 3-hour job hold the worker (and the swap) for a whole day.
      KLAKET_MAX_DURATION: "7200"
      # Scene descriptions need an LLM (ollama/openai): off, fully offline.
      KLAKET_VLM: "off"

      # All model caches on the bind mount, never in the writable layer.
      KLAKET_MODEL_DIR: /models
      HF_HOME: /models
      XDG_DATA_HOME: /models

      # ffmpeg/yt-dlp scratch must be writable; /tmp is read-only below
      # because it is the shared input scratch with the other MCP servers.
      TMPDIR: /data/tmp

      # Leave a core for the rest of the stack (gateway, litellm, ...).
      OMP_NUM_THREADS: "2"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - /opt/docker/compose/mcp/klaket-data:/data:rw
      - /opt/docker/compose/mcp/klaket-models:/models:rw
      # Media the agent already knows the path of, read-only at the same path.
      # Prefer /opt/projects over /tmp for real footage: /tmp is a 4 GB tmpfs,
      # i.e. RAM.
      - /tmp:/tmp:ro
      - /opt/projects:/opt/projects:ro
      - /opt/docker/compose:/opt/docker/compose:ro

    networks:
      - mcp

  mcp-gateway:
    image: docker/mcp-gateway:latest
    container_name: mcp-gateway
    mem_limit: 512m
    restart: "no"

    # The gateway owns the long-lived stdio children it spawns
    # (`docker run --rm ...`): it releases them on a graceful shutdown, so
    # give it room to do that instead of letting the 10s docker default
    # SIGKILL it mid-teardown — that was the source of the orphaned
    # chroma/telegram-notify containers.
    stop_grace_period: 90s

    command:
      - --transport=streaming
      - --port=8811
      - --catalog=/root/.docker/mcp/catalogs/custom.yaml
      - --servers=websearch
      - --servers=searxng
      - --servers=telegram-notify
      - --servers=fetch
      - --servers=chroma
      - --servers=onionclaw      
      - --servers=context7
      - --servers=model-council
      - --servers=playwright
      - --servers=chrome-devtools
      - --servers=local-image-reader
      - --servers=klaket
      - --verify-signatures=false
      - --secrets=/root/.docker/mcp/.env

    ports:
      - "127.0.0.1:8813:8811"

    extra_hosts:
      - "host.docker.internal:host-gateway"


    environment:
      MCP_GATEWAY_AUTH_TOKEN: ${MCP_GATEWAY_AUTH_TOKEN}
      MCP_GATEWAY_DOCKER_BIND_ALLOWED_PATHS: "/opt/docker/compose/mcp/model-council-data:/opt/projects:/opt/docker/compose:/tmp"
      # playwright's browser profile lives on /opt (never in the container layer,
      # i.e. never in /var/lib/docker on the small root fs); rw needs this list.
      # /tmp is here for playwright's output dir (screenshots/downloads land in
      # the shared host /tmp, rw); /tmp is already in the RO allowlist above.
      # websearch-data keeps the query cache and the circuit-breaker state
      # across container restarts (the gateway stops idle children), so a
      # breaker that opened on a throttled IP does not have to be relearned.
      MCP_GATEWAY_DOCKER_BIND_ALLOW_WRITABLE_PATHS: "/opt/docker/compose/mcp/chroma-data:/opt/docker/compose/mcp/chroma-cache:/opt/docker/compose/mcp/onionclaw-data:/opt/docker/compose/mcp/websearch-data:/opt/blast/cache/ms-playwright-mcp:/opt/blast/cache/ms-playwright:/tmp"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./catalog:/root/.docker/mcp/catalogs:ro
      - ./.env:/root/.docker/mcp/.env:ro

    security_opt:
      - no-new-privileges:true

    # Stop ordering: the gateway must go down *before* the backends its
    # children talk to (chroma, searxng, torproxy), so it can release the
    # children while those are still reachable. Compose stops in reverse
    # dependency order, hence the gateway depends_on them.
    depends_on:
      - chroma
      - searxng
      - torproxy

    networks:
      - mcp


  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    mem_limit: 512m
    restart: "no"

    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml

    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      - valkey

    networks:
      - mcp


  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: searxng-valkey
    mem_limit: 256m
    restart: "no"

    command:
      - valkey-server
      - --save
      - "300"
      - "1"
      - --loglevel
      - warning

    volumes:
      - valkey-data:/data

    security_opt:
      - no-new-privileges:true

    networks:
      - mcp

  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    mem_limit: 1g
    restart: no

    volumes:
      - ./chroma-data:/data

    ports:
      - "8000:8000"

    networks:
      - mcp

  # Keeps the council roster in step with LiteLLM (rules engine, see
  # model-council-data/sync-rules.json): adds a seat when a qualifying model
  # appears AND its probe answers, drops one after REMOVE_AFTER_MISSES failed
  # cycles (missing, gone, or probe-fail), removes paid seats the same cycle,
  # puts repeatedly-rejected candidates on a CANDIDATE_RETRY_HOURS cooldown;
  # no member is static — anything no rule claims is dropped. Rewrites
  # config.json only on a real change; the council server reads its roster
  # live (see model-council/entrypoint.py), so RESTART_GATEWAY is off and
  # the gateway is never bounced. Restarting it tore the whole stack down
  # (--abort-on-container-exit) and made the gateway respawn — and leak —
  # its long-lived stdio children.
  model-council-sync:
    image: python:3.12-alpine
    container_name: model-council-sync
    mem_limit: 64m
    restart: unless-stopped
    command:
      - python3
      - -u
      - /srv/sync.py
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./model-council-data:/config:rw
      - ./model-council-sync:/srv:ro
    environment:
      SYNC_INTERVAL: "3600"
      REMOVE_AFTER_MISSES: "2"
      CANDIDATE_STRIKES: "2"
      CANDIDATE_RETRY_HOURS: "24"
      PROBE_ENABLED: "true"
      # gpt4free probes are NOT free for this host: each one drives g4f's
      # AutoFree provider chain, and the browser-based providers hammer the
      # shared gpt4free-chromium container. 12 concurrent probes at 60s
      # pushed Chromium to 1 GiB (177% CPU) and the OOM killer took this
      # container, the session proxy and the image checker down with it
      # (2026-11-02 15:39). Keep the fleet small and the per-probe budget
      # tight; a dead g4f id now costs one timeout instead of two (see
      # probe() in sync.py: no second body after a transport failure).
      PROBE_WORKERS: "4"
      PROBE_TIMEOUT: "30"
      RESTART_GATEWAY: "false"
      GATEWAY_CONTAINER: "mcp-gateway"
    security_opt:
      - no-new-privileges:true
    networks:
      - mcp

  # Session-healing reverse proxy in front of the docker-mcp gateway.
  # The gateway evicts idle in-memory MCP sessions (and loses them on
  # restart); streamable-HTTP clients that cache Mcp-Session-Id then hit a
  # permanent 404 "session not found". This proxy owns one upstream session,
  # hands the client a STABLE id, and re-initializes transparently on 404.
  mcp-session-proxy:
    image: python:3.12-alpine
    container_name: mcp-session-proxy
    mem_limit: 256m
    restart: unless-stopped
    command:
      - python3
      - -u
      - /srv/proxy.py
    volumes:
      - ./session-proxy/proxy.py:/srv/proxy.py:ro
      - ./.env:/opt/docker/compose/mcp/.env:ro
    environment:
      MCP_PROXY_UPSTREAM: http://mcp-gateway:8811/mcp
      MCP_PROXY_UPSTREAM_TIMEOUT: "900"
      MCP_PROXY_HOST: "0.0.0.0"
      MCP_PROXY_PORT: "8812"
      # Idle release: the gateway keeps one child container per `longLived`
      # server for as long as our upstream session lives (browsers: Chromium
      # included). After 15 min with no client traffic the proxy DELETEs the
      # session, the gateway stops those children, and the next tool call
      # re-initializes and starts only the container it needs. 0 disables.
      MCP_PROXY_IDLE_TTL: "900"
      MCP_PROXY_IDLE_SWEEP: "30"
    ports:
      - "8811:8812"
      - "8812:8812"
    depends_on:
      - mcp-gateway
    networks:
      - mcp

  # Tool surface reducer: TWO constant meta-tools (`tools_search`, `tool_call`)
  # in front of every MCP server this stack runs.
  #
  # Why: an MCP server advertises every tool it owns, and the client re-sends
  # the whole list to the model on EVERY turn, at the top of the prompt. This
  # stack is 126 tools / ~107k chars of JSON schema = 33k-47k tokens. On the
  # cheap LLM node (Orange Pi Zero 3W, 12.288 ctx, 20-35 tok/s prefill) that is
  # not a cost, it is an impossibility: measured, a 47k-token prompt needs ~40
  # minutes to prefill. And because the tools block sits at the START of the
  # prompt, pruning it per request invalidates llama.cpp's prefix cache and the
  # conversation is re-prefilled from zero - so the surface must be SMALL *and
  # CONSTANT*, which rules out tool-RAG inside litellm as well.
  #
  # Two meta-tools (~250 tokens) cost 2 extra turns per task and keep every
  # tool reachable: `tools_search` returns the full JSON schema of the k best
  # matches from a semantic index built with the stack's own `embedding-model`
  # (measured recall@8 15/18 on an Italian benchmark, 108 ms per query, versus
  # 9/18 for Open WebUI's BM25 tool search), `tool_call` executes any tool on
  # its upstream and relays the result verbatim (images included).
  #
  # Its `MCP_LITE_UPSTREAMS` list decides what one client connection covers;
  # today that is the whole gateway (109 tools). Clients that want the native
  # surface keep using the session proxy on :8811; nothing changes for them.
  mcp-tools-lite:
    image: python:3.12-alpine
    container_name: mcp-tools-lite
    # The index is 109 x 1024 floats plus the catalogue: ~20 MB of Python.
    mem_limit: 192m
    restart: unless-stopped
    command:
      - python3
      - -u
      - /srv/proxy.py
    volumes:
      - ./tools-lite/proxy.py:/srv/proxy.py:ro
      # Index cache: rebuilding it costs ~100 s of the cheap node's CPU, so it
      # survives restarts and is redone only when the catalogue changes.
      - ./tools-lite/cache:/cache:rw
    environment:
      # `token_env` names are resolved by the proxy from its own environment:
      # no secret is written in this file.
      MCP_LITE_UPSTREAMS: >-
        [{"name":"gateway","url":"http://mcp-gateway:8811/mcp","token_env":"MCP_GATEWAY_AUTH_TOKEN"}]
      MCP_GATEWAY_AUTH_TOKEN: ${MCP_GATEWAY_AUTH_TOKEN}
      # Front-door token: the same bearer the clients already send to the
      # gateway, so switching a client to :8814 needs no new credential.
      # /health stays open (container healthcheck); empty = no authentication.
      MCP_LITE_AUTH_TOKEN: ${MCP_GATEWAY_AUTH_TOKEN}
      # The cheap node's Qwen3-Embedding-0.6B (llama-swap, alias
      # embedding-model). If it is down the proxy falls back to a lexical
      # scorer: recall drops, availability does not.
      MCP_LITE_EMBED_URL: ${MCP_LITE_EMBED_URL:-http://192.168.1.142:10001/v1/embeddings}
      MCP_LITE_EMBED_MODEL: embedding-model
      MCP_LITE_CACHE: /cache/index.json
      MCP_LITE_TOP_K: "3"
      MCP_LITE_REFRESH_TTL: "3600"
      # A refresh reads tools/list from every upstream in parallel; a hung MCP
      # server costs this much and then keeps its previous tools, so it can
      # never stall the proxy.
      MCP_LITE_REFRESH_TIMEOUT: "45"
      # Minimum gap between two stale checks (a search asks for a refresh).
      MCP_LITE_REFRESH_MIN_GAP: "30"
      # Same contract as the session proxy: after 15 min without client traffic
      # the upstream sessions are released, so the gateway stops the long-lived
      # child containers (Chromium, ...) it keeps per session.
      MCP_LITE_IDLE_TTL: "900"
      # The everyday tools, advertised flat next to the two meta-tools: one
      # surface, all 109 tools still reachable through tools_search/tool_call.
      # The cheap node's 1.5B-active MoE cannot drive the meta-tool
      # indirection (find_tool -> tool_call -> answer is 1/3 usable: it ranks
      # `ask` for "Gerry Scotti" and gets 14 kB back), while it calls a flat
      # web_search 5/5 with the right arguments. So the same proxy names these
      # six directly and keeps the catalogue behind the meta-tools for
      # everything else. web_search, web_url_read and search_and_read have
      # hand-written minimal schemas (search_and_read is the proxy's own: it
      # runs the other two); the rest get a compact one derived from the
      # catalogue.
      MCP_LITE_FLAT_TOOLS: "web_search,web_url_read,search_and_read,send_message,read_image,chroma_query_documents,terminal_run,terminal_file"
      # Measured on Open WebUI chat 0407eb2f ("cerca sul web chi è Gerry Scotti",
      # 252 s and six model hops): a 300-char snippet of the Wikipedia lead was
      # cut before the fact asked for, so the model opened the page anyway.
      # Wider snippets answer from the search itself, and search_and_read does
      # search+read in one call, so the loop costs two hops instead of six.
      MCP_LITE_FLAT_MAX_RESULTS: "5"
      MCP_LITE_FLAT_SNIPPET: "500"
      # The flat chroma tool takes `query` only: the model cannot guess a
      # collection name, so the deployment supplies it.
      MCP_LITE_MEMORY_COLLECTION: "aiderdesk_cheap-llm-stack_memory"
      # Terminal: the Open Terminal REST API of the media host (the same
      # container Open WebUI's terminal panel uses), as TWO flat tools
      # instead of the 22-tool / ~4.6k-token surface Open WebUI attaches to a
      # model. Reachability is the external network open-terminal-net; the key
      # is the same value the openwebui compose uses, read from .env (this
      # file never carries a secret). Empty MCP_LITE_TERMINAL_URL = kill
      # switch: the two tools disappear from the surface.
      MCP_LITE_TERMINAL_URL: "http://open-terminal:8000"
      MCP_LITE_TERMINAL_KEY: ${OPEN_TERMINAL_API_KEY:-}
    ports:
      - "8814:8814"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8814/health", timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - mcp-gateway
    networks:
      - mcp
      # The media host's open-terminal container is not on ai-mcp (it belongs
      # to the openwebui compose), so the two projects share this external
      # network instead of a published port: nothing new is exposed on the
      # host, and the terminal API stays reachable only by these containers.
      # Created once, by hand: docker network create open-terminal-net
      - open-terminal-net

volumes:

  searxng-cache:
    name: searxng-cache

  valkey-data:
    name: searxng-valkey



networks:

  mcp:
    name: ai-mcp
    driver: bridge

  # Shared with /opt/docker/compose/openwebui (open-terminal service): it
  # exists in neither project, so it is declared external in both.
  open-terminal-net:
    external: true
