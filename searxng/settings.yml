use_default_settings:
  engines:
    remove:
      - ahmia
      - torch
      - wikidata

general:
  instance_name: "Local SearXNG"

server:
  secret_key: "801a799f4d0298bd53cd7265eeaa7955a9748ba5a2b61ac62c28b963b4aba1f6"
  bind_address: "0.0.0.0"
  port: 8080

search:
  formats:
    - html
    - json

engines:
  # Bing is keyless and, measured from this host, answers a plain general/web
  # query in ~0.6s with ~10 results and no CAPTCHA -- but it ships disabled in
  # SearXNG's defaults. Enabling it keeps general/web queries alive while
  # DuckDuckGo is serving a CAPTCHA (which it does under sustained volume).
  - name: bing
    disabled: false

  # The `brave` engine scrapes search.brave.com, which answers scrapers with
  # HTTP 429 and a byte-identical anti-bot page -- from this host and from a Tor
  # exit alike. That is bot detection, not an IP quota we could rotate around.
  # It cannot return results; it only spends a request per query and pollutes
  # `unresponsive_engines`. Brave-indexed results now come from the keyed
  # `tavily` server instead. Re-enable if Brave lifts the block.
  - name: brave
    disabled: true

outgoing:
  # Per-engine timeout: give throttled/slow upstreams a little more room
  # before SearXNG gives up on them.
  request_timeout: 5.0
  pool_connections: 100
  enable_http2: true

limiter:
  enabled: false
