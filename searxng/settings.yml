use_default_settings:
  # L5 of the search stack: the always-up, keyless fallback behind the
  # `websearch` MCP browser lanes.
  #
  # Everything that scrapes a general-purpose SERP is gone on purpose. Measured
  # from this host: duckduckgo answers HTTP 202 with an anomaly page, Brave 429,
  # Google a /sorry CAPTCHA, Startpage a suspension notice, Mojeek/Ecosia 403 --
  # and Bing serves a *degraded* page over plain HTTP (only the first keyword is
  # honoured, or an explicit empty SERP) even though a real browser gets good
  # results with form=QBLH. Keeping those engines only burned requests and
  # filled `unresponsive_engines` with noise.
  #
  # What is left needs no API key and no bot-friendly IP: curated/direct
  # indexes (mwmbl, wiby) plus upstream JSON APIs (github, hackernews,
  # stackoverflow, mdn, pypi, npm, crates.io, arxiv, openalex, crossref).
  # General-web coverage comes from the `websearch` MCP; this instance is the
  # fallback that cannot be rate-limited into silence.
  engines:
    keep_only:
      - mwmbl
      - wiby
      - github
      - hackernews
      - stackoverflow
      - mdn
      - pypi
      - npm
      - crates.io
      - arxiv
      - openalex
      - crossref

general:
  instance_name: "Local SearXNG (keyless)"

server:
  secret_key: "801a799f4d0298bd53cd7265eeaa7955a9748ba5a2b61ac62c28b963b4aba1f6"
  bind_address: "0.0.0.0"
  port: 8080

search:
  formats:
    - html
    - json
  safe_search: 1
  # No autocomplete engine survives keep_only; disabling it avoids a request to
  # a removed engine on every keystroke.
  autocomplete: ""

# Most of these upstreams ship disabled in SearXNG's defaults (they are niche),
# so every engine we keep has to be switched on explicitly.
engines:
  - name: mwmbl
    disabled: false

  - name: wiby
    disabled: false

  - name: github
    disabled: false

  - name: hackernews
    disabled: false

  - name: stackoverflow
    disabled: false

  - name: mdn
    disabled: false

  - name: pypi
    disabled: false

  - name: npm
    disabled: false

  - name: crates.io
    disabled: false

  - name: arxiv
    disabled: false

  - name: openalex
    disabled: false

  - name: crossref
    disabled: false

outgoing:
  # YaCy peers and GitHub's anonymous API are slower than a scraped SERP.
  request_timeout: 8.0
  pool_connections: 100
  enable_http2: true

limiter:
  enabled: false
