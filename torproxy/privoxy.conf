# Minimal Privoxy config: HTTP proxy on 8118 tunnelled through the local Tor
# SOCKS5 port. The action/filter files come from the Alpine package (the
# Dockerfile renames the packaged *.new files).
confdir /etc/privoxy
logdir /var/log/privoxy

actionsfile match-all.action
actionsfile default.action
actionsfile user.action
filterfile default.filter

listen-address 0.0.0.0:8118
toggle 1
enable-remote-toggle 0
enable-remote-http-toggle 0
enable-edit-actions 0

# Privoxy starts as root and drops to this unprivileged user.
user privoxy

forward-socks5t / 127.0.0.1:9050 .
