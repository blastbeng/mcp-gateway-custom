name: local-ai
displayName: Local AI MCP Servers

registry:

  chroma:
    type: server
    image: mcp/chroma:latest
    description: >
      Local semantic vector memory for AiderDesk.
      Stores and retrieves project documentation, architectural decisions,
      technical knowledge and persistent project context using semantic search.

    command:
      - "chroma-mcp"
      - "--client-type"
      - "http"
      - "--host"
      - "chroma"
      - "--port"
      - "8000"
      - "--ssl"
      - "false"

    volumes:
      - "/opt/docker/compose/mcp/chroma-data:/data:rw"
      - "/opt/docker/compose/mcp/chroma-cache:/root/.cache:rw"

    longLived: true

  searxng:
    type: server
    image: isokoliuk/mcp-searxng:latest
    description: Local SearXNG web search MCP server.

    env:
      - name: SEARXNG_URL
        value: http://searxng:8080

  open-websearch:
    title: Open WebSearch
    type: server
    image: ghcr.io/aas-ee/open-web-search:latest
    description: >
      Self-hosted multi-engine keyword search (Bing, DuckDuckGo, Brave,
      Startpage, Exa, Hacker News) with no API keys. Robust fallback to the
      local SearXNG instance.

    env:
      - name: MODE
        value: "stdio"

      - name: DEFAULT_SEARCH_ENGINE
        value: "duckduckgo"

      - name: ALLOWED_SEARCH_ENGINES
        value: "duckduckgo,brave,startpage,hackernews,exa"

  tavily:
    title: Tavily Search
    type: server
    image: mcp/tavily:latest
    description: >
      Keyed fallback for when the scraped engines throttle or block. The Tavily
      API is not subject to scraper bot-detection or per-IP CAPTCHA cooldowns,
      so it answers when SearXNG's brave/duckduckgo/google lanes are down.
      Provides search, extract, crawl, map and research tools.

    secrets:
      - name: TAVILY_API_KEY
        env: TAVILY_API_KEY

  telegram-notify:
    title: Telegram Notify
    type: server
    image: telegram-notify-mcp:latest
    description: >
      One-way Telegram notifications. One fixed bot, one fixed chat id:
      both come from .env (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID), and every
      send defaults to that chat. Use it to push
      task-finished / needs-attention alerts and Open WebUI automation
      output. Tools: send_message, send_document, send_photo, send_video,
      send_audio, get_updates.

    secrets:
      - name: TELEGRAM_BOT_TOKEN
        env: TELEGRAM_BOT_TOKEN

      - name: TELEGRAM_CHAT_ID
        env: TELEGRAM_CHAT_ID

    # send_document / send_photo / send_video / send_audio prendono un filePath
    # locale: /tmp e' lo scratch condiviso con host e altri server, montato RO
    # allo stesso percorso cosi' un file scritto altrove in /tmp si invia qui.
    volumes:
      - "/tmp:/tmp:ro"

    longLived: true

  onionclaw:
    title: OnionClaw / SICRY
    type: server
    image: onionclaw-mcp:latest

    description: >
      Tor and dark-web OSINT MCP server based on SICRY.
      Searches multiple onion search engines, fetches onion URLs,
      checks search-engine health, crawls onion sites and exports
      structured OSINT data.

    env:
      - name: TOR_SOCKS_HOST
        value: "torproxy"

      - name: TOR_SOCKS_PORT
        value: "9050"

      - name: SICRY_DB_PATH
        value: "/data/sicry.db"

      - name: SICRY_MAX_CHARS
        value: "12000"

      - name: SICRY_SEARCH_CACHE_TTL
        value: "1800"

      - name: SICRY_ENGINE_CACHE_TTL
        value: "3600"

    volumes:
      - "/opt/docker/compose/mcp/onionclaw-data:/data:rw"

    longLived: true

  context7:
    title: Context7
    type: remote
    description: >
      Up-to-date, version-specific documentation and code examples
      for programming libraries and frameworks.
    remote:
      transport_type: streamable-http
      url: https://mcp.context7.com/mcp

    longLived: true

  model-council:
    title: Model Council
    type: server
    image: model-council-mcp:latest

    description: >
      Multi-model AI council using LiteLLM as an OpenAI-compatible
      backend. Provides second opinions, code reviews, architecture
      advice and multi-model synthesis.

    env:
      - name: COUNCIL_CONFIG
        value: "/config/config.json"

    volumes:
      - "/opt/docker/compose/mcp/model-council-data:/config:ro"
      - "/opt/projects:/opt/projects:ro"
      - "/opt/docker/compose:/opt/docker/compose:ro"
      # materials[].path legge un file locale: /tmp montato RO come per gli
      # altri server (questo container gira come root), cosi' un path sotto
      # /tmp risolve identico qui.
      - "/tmp:/tmp:ro"

    longLived: true

  playwright:
    title: Playwright
    type: server
    image: playwright-mcp:latest
    description: >
      Headless browser automation (Chromium) from Microsoft's Playwright MCP:
      navigate, snapshot, click, type, screenshot, evaluate and inspect network
      traffic. Runs as a gateway-managed container instead of a host npx
      process, so it no longer depends on the host Node runtime. Chromium
      itself is baked into the image; the persistent browser profile is
      bind-mounted from /opt so it stays off the (small) root filesystem and
      survives gateway restarts. `playwright-mcp:latest` is a thin wrapper on
      mcp/playwright:latest (see playwright/) that clears the stale Chromium
      SingletonLock a previous container leaves in the profile.

    # Playwright-MCP limita l'accesso al filesystem a due "allowed roots":
    # l'output dir e la cwd (workspace root, /home/node). Senza override
    # l'output dir e' <cwd>/.playwright-mcp, quindi un path in /tmp viene
    # rifiutato con "File access denied ... outside allowed roots". Portandola
    # a /tmp, /tmp diventa una root ammessa (upload/drop e nomi di file
    # espliciti sotto /tmp funzionano) SENZA --allow-unrestricted-file-access,
    # che invece aprirebbe tutto il filesystem. Inoltre gli output senza nome
    # (screenshot, snapshot) finiscono nello /tmp condiviso, dove li vedono
    # telegram-notify e local-image-reader.
    env:
      - name: PLAYWRIGHT_MCP_OUTPUT_DIR
        value: "/tmp"

    # Chromium ships inside the image (PLAYWRIGHT_BROWSERS_PATH=/ms-playwright),
    # but the persistent profile does not: the server writes it to
    # $HOME/.cache/ms-playwright-mcp (HOME=/home/node, uid 1000), which would
    # otherwise land in the container's writable layer, i.e. inside
    # /var/lib/docker on the small root filesystem. Mounted from /opt instead -
    # the same directory the old host npx server used, so logins/cookies carry
    # over. Host dir is owned by uid 1000, which is the container's `node` user.
    volumes:
      - "/opt/blast/cache/ms-playwright-mcp:/home/node/.cache/ms-playwright-mcp:rw"

      # Playwright-MCP also keeps a "server registry" under
      # ~/.cache/ms-playwright (it does NOT honour PLAYWRIGHT_BROWSERS_PATH,
      # which only covers the browsers baked at /ms-playwright). Without a
      # mount there, docker creates the missing parent /home/node/.cache as
      # root:root and the unprivileged `node` user gets
      # "EACCES: permission denied, mkdir '/home/node/.cache/ms-playwright'".
      # uid 1000 on both sides, and kept on /opt so nothing lands on the
      # small root filesystem.
      - "/opt/blast/cache/ms-playwright:/home/node/.cache/ms-playwright:rw"

      # /tmp resta lo scratch condiviso: e' l'output dir del server (vedi
      # PLAYWRIGHT_MCP_OUTPUT_DIR sopra), quindi screenshot e download
      # atterrano sullo /tmp dell'host e sono raggiungibili da telegram-notify
      # e local-image-reader. Il mount rw richiede /tmp anche in
      # MCP_GATEWAY_DOCKER_BIND_ALLOW_WRITABLE_PATHS.
      - "/tmp:/tmp:rw"

    longLived: true

  local-image-reader:
    title: Local Image Reader
    type: server
    image: local-image-reader-mcp:latest
    description: >
      Reads a local image file and returns it as base64 ImageContent for a
      vision-capable client model. Single tool: read_image
      (PNG/JPEG/GIF/WebP/BMP/SVG). The project trees and /tmp are bind-mounted
      read-only at their original paths so a path the agent already knows
      resolves unchanged inside the container.

    volumes:
      - "/opt/projects:/opt/projects:ro"
      - "/opt/docker/compose:/opt/docker/compose:ro"
      - "/tmp:/tmp:ro"

    longLived: true